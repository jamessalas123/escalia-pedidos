<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>if(/\.vercel\.app$/.test(location.hostname))location.replace('https://pide.escaliadigital.com'+location.pathname+location.search+location.hash)</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta</title>
<link href="/fonts/inter.css" rel="stylesheet">
<style>
:root{--g:#545454;--b:#E8E8E8;--s:#F3F3F3;--v:#0B7A3E;--r:#B42318}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#000;background:#fff;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
.wrap{max-width:720px;margin:0 auto;padding-bottom:110px}
.cover{height:170px;background:#EEE center/cover no-repeat}
.info{padding:16px}
.muted{color:var(--g);font-size:14px;margin:4px 0 0}
.note{display:flex;align-items:center;gap:8px;color:#000;font-size:14px;margin:0}
.notes{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--s)}
.lnk{border:0;background:none;padding:0;text-decoration:underline;color:#000;font-size:14px;cursor:pointer}
.h2{font-size:20px;font-weight:700;margin:0}
.dest{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.dcard{flex:none;width:150px;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.ph{position:relative;display:block;background:#EEE center/cover no-repeat;border-radius:12px}
.ph.fit{background-size:contain;background-color:#fff}
.ph.hero{width:100%;aspect-ratio:1/1;max-height:62vh;border-radius:0;background-size:contain;background-color:#fff}
.sel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px}
.sel button{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:10px;border:1px solid var(--b);border-radius:12px;background:#fff;text-align:left;font:inherit;color:inherit;cursor:pointer}
.sel button[disabled]{border:2px solid #000;cursor:default}
.sel .ph{width:100%;aspect-ratio:1/1;border-radius:8px}
.sel .tag{font-size:12px;font-weight:600}
.aviso{margin:6px 16px 14px;padding:12px 14px;border-radius:12px;background:#F3F3F3;font-size:15px;line-height:1.4}
.btn2{display:block;width:100%;max-width:688px;margin:0 auto 10px;height:46px;border-radius:8px;border:1px solid #000;background:#fff;color:#000;font-size:15px;font-weight:600;cursor:pointer}
.plus{position:absolute;right:8px;bottom:8px;min-width:34px;height:34px;padding:0 8px;border-radius:17px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.18);font-weight:700}
.tabs{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--b);display:flex;gap:22px;overflow-x:auto;padding:0 16px;scrollbar-width:none;margin-top:18px}
.tabs a{flex:none;padding:13px 0 10px;border-bottom:3px solid transparent;color:#000;text-decoration:none;font-size:15px}
.tabs a.on{border-color:#000;font-weight:600}
.listoya{position:fixed;inset:0;z-index:60;background:#0B7A3E;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;font-size:18px;line-height:1.4}
.listoya p{margin:0}.listoya .t{font-size:28px;font-weight:800}
.listoya .n{font-size:100px;font-weight:900;line-height:1;background:#fff;color:#0B7A3E;border-radius:24px;padding:10px 28px}
.listoya button{margin-top:16px;border:0;background:#fff;color:#000;border-radius:12px;padding:16px 36px;font-size:17px;font-weight:700;cursor:pointer}
.mipedido{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:#E7F5EC;color:#0B6B37;font:inherit;font-size:15px;cursor:pointer;text-align:left}
@media (hover:hover) and (pointer:fine){.tabs{flex-wrap:wrap;row-gap:0}.dest{scrollbar-width:thin;scrollbar-color:#BDBDBD transparent;padding-bottom:10px}}
section.cat{padding:22px 16px 0;scroll-margin-top:52px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.item{display:flex;min-height:112px;border:1px solid var(--b);border-radius:12px;overflow:hidden;background:#fff;padding:0;text-align:left;cursor:pointer;width:100%}
.item .t{flex:1;min-width:0;padding:14px;display:flex;flex-direction:column;gap:4px}
.item .ph{width:112px;flex:none;border-radius:0}
.item.off{background:#FAFAFA;cursor:default}
.item.off .name,.item.off .price{color:#6B6B6B}
.name{font-size:16px;font-weight:500}
.price{font-size:14px;color:var(--g)}
.desc{font-size:13px;color:var(--g);line-height:1.35}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--b);z-index:10}
.btn{display:flex;align-items:center;justify-content:center;width:100%;max-width:688px;margin:0 auto;height:54px;border-radius:8px;border:0;background:#000;color:#fff;font-size:16px;font-weight:600;cursor:pointer;gap:10px}
.btn.split{justify-content:space-between;padding:0 18px}
.badge{min-width:24px;height:24px;border-radius:12px;background:#fff;color:#000;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;padding:0 6px}
.sheet{position:fixed;inset:0;z-index:20;background:#fff;overflow-y:auto;overscroll-behavior:contain;display:none;scroll-behavior:smooth}
.sheet.escribiendo .foot{display:none}
.sheet.escribiendo .inner{padding-bottom:40vh}
html.bloq,html.bloq body{overflow:hidden;background:#fff}
html.bloq #app,html.bloq #bar{visibility:hidden}
.sheet.open{display:block}
#alerg{z-index:30}
#legal{z-index:40}
.legal h2{font-size:17px;margin:22px 0 6px}
.legal p,.legal li{font-size:14px;line-height:1.55;color:#222;margin:6px 0}
.legal ul{padding-left:20px;margin:6px 0}
.legal table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.legal td,.legal th{border-bottom:1px solid var(--b);padding:8px 6px 8px 0;text-align:left;vertical-align:top}
.pie{display:flex;flex-wrap:wrap;gap:6px 14px;padding:16px 16px 0}
.pie .lnk{font-size:13px;color:var(--g)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;margin-top:12px;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;flex:none;accent-color:#000}
.chk a{color:#000}
.inner{max-width:720px;margin:0 auto;padding-bottom:150px}
.close{position:absolute;left:16px;top:16px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:18px;cursor:pointer}
.sep{height:8px;background:var(--s);margin:16px -16px}
.opt{display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid var(--b);font-size:16px;cursor:pointer}
.opt input{width:22px;height:22px;accent-color:#000;margin:0}
.pill{padding:4px 10px;border-radius:999px;background:var(--s);font-size:13px;font-weight:500;white-space:nowrap}
.pill.err{background:#FDECEA;color:var(--r)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;margin-top:12px}
.field input{height:50px;border:0;border-radius:8px;background:var(--s);padding:0 14px;font-size:16px;font-weight:400}
.qty{display:flex;align-items:center;background:var(--s);border-radius:999px;padding:3px;flex:none}
.qty button{width:40px;height:40px;border:0;background:none;border-radius:50%;font-size:20px;cursor:pointer}
.qty span{min-width:18px;text-align:center;font-weight:600}
.del{width:40px;height:40px;border:0;border-radius:50%;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;color:#000}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--b);padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
.foot .row{max-width:688px;margin:0 auto;display:flex;gap:12px;align-items:center}
.line{display:flex;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--b)}
.line .ph{width:56px;height:56px;border-radius:8px;flex:none}
.edit{display:flex;gap:10px;align-items:center;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.edit .cambiar{font-size:13px;color:var(--g);text-decoration:underline;margin-top:2px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.err{color:var(--r);font-size:13px;font-weight:500;margin:8px 0 0}
.top{display:flex;align-items:center;gap:8px;padding:14px 12px 6px}
.back{width:44px;height:44px;border:0;background:none;font-size:26px;cursor:pointer;flex:none}
.state{padding:60px 20px;text-align:center;color:var(--g)}
.tabla{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
.tabla td{padding:10px 0;border-bottom:1px solid var(--b);vertical-align:top}
.tabla td+td{padding-left:12px;color:var(--g)}
.grid14{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div id="app"><p class="state">Cargando carta…</p></div>
<div id="ficha" class="sheet" role="dialog" aria-modal="true" aria-label="Producto"></div>
<div id="pedido" class="sheet" role="dialog" aria-modal="true" aria-label="Tu pedido"></div>
<div id="elegir" class="sheet" role="dialog" aria-modal="true" aria-label="Cambiar producto"></div>
<div id="alerg" class="sheet" role="dialog" aria-modal="true" aria-label="Alérgenos"></div>
<div id="legal" class="sheet" role="dialog" aria-modal="true" aria-label="Información legal"></div>
<div id="bar" class="bar" hidden></div>
<script src="/vendor/supabase.js"></script>
<script>
const sb = supabase.createClient('https://akfnzkdavpktvqugqklo.supabase.co', 'sb_publishable_ipLUEVx2Hwwf-PJR8EnL9A_X8vh9DD5', { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
const slug = location.pathname.split('/').filter(Boolean)[0] || '';
// Todos los pedidos de la web van a la misma fila (P1, P2…), se pida desde casa o desde el local
const ORIGEN = 'online';
{ const m = /^(panel|admin)\W+$/i.exec(slug); if (m) location.replace('/' + m[1].toLowerCase()); }
const eur = n => Number(n).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const img = u => u ? `background-image:url('${esc(u)}')` : '';
const catDe = p => CATS.find(c => c.id === p.categoria_id) || {};
const esBebida = p => /bebida/i.test(catDe(p).nombre || '');
const fit = p => esBebida(p) ? ' fit' : '';
const OTRO = { 'Tacos': 'otro taco', 'Menús': 'otro menú', 'Durum y Pita': 'otro durum o pita', 'Durum': 'otro durum', 'Platos': 'otro plato', 'Hamburguesas': 'otra hamburguesa', 'Patatas': 'otras patatas', 'Döner Box': 'otro Döner Box', 'Bebidas': 'otra bebida' };
function reemplazarLinea(idx, linea) {
  cart.splice(idx, 1);
  const ex = cart.find(l => l.key === linea.key);
  if (ex) ex.qty += linea.qty; else cart.splice(Math.min(idx, cart.length), 0, linea);
  save();
}
const ALERGENOS = ['Gluten', 'Crustáceos', 'Huevos', 'Pescado', 'Cacahuetes', 'Soja', 'Lácteos', 'Frutos de cáscara', 'Apio', 'Mostaza', 'Sésamo', 'Sulfitos', 'Altramuces', 'Moluscos'];
const ICO_BOLSA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>';
const ICO_AVISO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>';
const ICO_BORRAR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
const $ = id => document.getElementById(id);
let N, CATS = [], PRODS = [], GRUPOS = [], OPCS = [], cart = [];
const KEY = 'carrito-' + slug;
try { cart = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { cart = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cart)); } catch (e) {} };
const abiertas = () => document.querySelectorAll('.sheet.open').length;
let scrollY0 = 0;
// Mientras se escribe en una hoja: se oculta la barra de "Pagar" para que no tape el cuadro, y el cuadro se centra en pantalla
const esCampo = t => t && t.matches && t.matches('input:not([type=checkbox]):not([type=radio]),textarea');
document.addEventListener('focusin', e => {
  const sh = e.target.closest && e.target.closest('.sheet'); if (!sh || !esCampo(e.target)) return;
  sh.classList.add('escribiendo');
  setTimeout(() => { if (document.activeElement === e.target) e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 350);
});
document.addEventListener('focusout', () => setTimeout(() => { if (!esCampo(document.activeElement)) document.querySelectorAll('.sheet.escribiendo').forEach(s => s.classList.remove('escribiendo')); }, 150));
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'cn') { e.preventDefault(); const t = document.getElementById('ct'); if (t) t.focus(); } else if (e.key === 'Enter' && e.target && e.target.id === 'ct') e.target.blur(); });
const lock = () => {
  const h = document.documentElement, abierto = abiertas() > 0;
  if (abierto && !h.classList.contains('bloq')) { scrollY0 = window.scrollY; document.body.style.top = -scrollY0 + 'px'; h.classList.add('bloq'); }
  else if (!abierto && h.classList.contains('bloq')) { h.classList.remove('bloq'); document.body.style.top = ''; window.scrollTo(0, scrollY0); }
};

async function load() {
  const { data: n, error } = await sb.from('negocios').select('id,nombre,slug,direccion,whatsapp,telefono,email_contacto,titular_nombre,titular_nif,horario,pedidos_pausados,modo_prueba').eq('slug', slug).eq('activo', true).maybeSingle();
  if (error || !n) { $('app').innerHTML = slug ? '<p class="state">Esta carta no está disponible.</p>' : '<p class="state">Para ver la carta, escanea el código QR del local o abre el enlace que te ha dado el establecimiento.</p>'; return; }
  N = n; document.title = n.nombre + ' · Carta';
  const [c, p, g, o] = await Promise.all([
    sb.from('categorias').select('*').eq('negocio_id', n.id).eq('activa', true).order('orden'),
    sb.from('productos').select('*').eq('negocio_id', n.id).order('orden'),
    sb.from('grupos_opciones').select('*').eq('negocio_id', n.id).order('orden'),
    sb.from('opciones').select('*').eq('negocio_id', n.id).eq('disponible', true).order('orden')
  ]);
  CATS = c.data || []; PRODS = p.data || []; GRUPOS = g.data || []; OPCS = o.data || [];
  const orden = Object.fromEntries(CATS.map(c => [c.id, c.orden]));
  PRODS.sort((a, b) => (orden[a.categoria_id] ?? 99) - (orden[b.categoria_id] ?? 99) || a.orden - b.orden);
  cart = cart.filter(l => PRODS.some(x => x.id === l.pid && x.disponible && Number(x.precio) > 0)
    && (l.ops || l.opciones || []).every(op => OPCS.some(x => x.nombre === op.nombre)));
  save();
  render(); bar();
  revisarPedidoGuardado();
}

function render() {
  const cats = CATS.filter(c => PRODS.some(p => p.categoria_id === c.id));
  const dest = ['Menús', 'Platos', 'Tacos'].map(nm => { const c = cats.find(x => x.nombre === nm); return c && PRODS.find(p => p.categoria_id === c.id && p.disponible && Number(p.precio) > 0); }).filter(Boolean);
  const portada = (PRODS.find(p => p.foto_url) || {}).foto_url;
  $('app').innerHTML = `<div class="wrap">
    <div class="cover" style="${img(portada)}" role="img" aria-label="Foto de portada"></div>
    <div class="info"><h1>${esc(N.nombre)}</h1>
      <p class="muted">${esc(cats.map(c => c.nombre).join(' · '))}</p>
      ${N.direccion ? `<p class="muted">${esc(N.direccion)}</p>` : ''}
      ${(() => { const e = estadoPedidos(); return e.abierto ? '' : `<p style="margin:12px 0 0;padding:12px 14px;border-radius:12px;background:#FFF4E0;font-size:14px;line-height:1.45"><strong>${e.pausa ? 'Pedidos online pausados un momento.' : 'Ahora no aceptamos pedidos online.'}</strong> ${e.cuando ? 'Volvemos ' + e.cuando + '.' : ''} Puedes ver la carta y preparar tu pedido.</p>`; })()}
      ${N.modo_prueba ? '<p style="margin:12px 0 0;padding:10px 14px;border-radius:12px;background:#F3F3F3;font-size:13px">Carta en modo prueba: los pedidos no se cobran.</p>' : ''}
      <div class="notes">
        <p class="note">${ICO_BOLSA}Solo para recoger en el local</p>
        <p class="note">${ICO_AVISO}Pide, paga y te avisamos por WhatsApp cuando esté listo</p>
      </div>
      <button class="lnk" id="al1" style="margin-top:12px">Ver alérgenos</button></div>
    ${dest.length ? `<h2 class="h2" style="margin:10px 16px">Destacados</h2><div class="dest">${dest.map(p => `<button class="dcard" data-p="${p.id}"><span class="ph" style="width:150px;height:140px;${img(p.foto_url, p._v)}"><span class="plus">+</span></span><span class="name" style="display:block;margin-top:6px">${esc(p.nombre)}</span><span class="price">${eur(p.precio)}</span></button>`).join('')}</div>` : ''}
    <nav class="tabs" aria-label="Categorías">${cats.map((c, i) => `<a href="#c${i}" class="${i ? '' : 'on'}">${esc(c.nombre)}</a>`).join('')}</nav>
    ${cats.map((c, i) => {
      const ps = PRODS.filter(p => p.categoria_id === c.id);
      const comun = ps.length > 1 && ps[0].descripcion && ps.every(p => p.descripcion === ps[0].descripcion);
      return `<section class="cat" id="c${i}"><h2 class="h2">${esc(c.nombre)}</h2>
        ${comun ? `<p class="muted">Todos ${esc(ps[0].descripcion.charAt(0).toLowerCase() + ps[0].descripcion.slice(1)).replace(/^incluye/, 'incluyen')}</p>` : ''}
        <div class="list">${ps.map(p => item(p, comun)).join('')}</div></section>`;
    }).join('')}
    <div style="padding:28px 16px 0"><button class="lnk" id="al2">Información sobre alérgenos</button></div>
    <nav class="pie" aria-label="Información legal">${LEGALES.map(([k, t]) => `<button class="lnk" data-legal="${k}">${t}</button>`).join('')}</nav>
  </div>`;
  document.querySelectorAll('[data-legal]').forEach(b => b.onclick = () => abrirLegal(b.dataset.legal));
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => abrirFicha(b.dataset.p));
  $('al1').onclick = $('al2').onclick = abrirAlergenos;
  espiarTabs();
}

function item(p, sinDesc) {
  const n = cart.filter(l => l.pid === p.id).reduce((a, l) => a + l.qty, 0);
  const foto = `<span class="ph${fit(p)}" style="${img(p.foto_url)}">${p.disponible ? `<span class="plus">${n || '+'}</span>` : ''}</span>`;
  if (!(Number(p.precio) > 0)) return `<div class="item off"><div class="t"><span class="name">${esc(p.nombre)}</span><span class="price">Precio por confirmar</span>${p.descripcion ? `<span class="desc">${esc(p.descripcion)}</span>` : ''}</div><span class="ph" style="${img(p.foto_url)}"></span></div>`;
  if (!p.disponible) return `<div class="item off"><div class="t"><span class="name">${esc(p.nombre)}</span><span class="price">${eur(p.precio)}</span><span style="font-size:14px;font-weight:500;color:var(--r)">Agotado</span></div>${foto}</div>`;
  return `<button class="item" data-p="${p.id}"><span class="t"><span class="name">${esc(p.nombre)}</span><span class="price">${eur(p.precio)}</span>${p.descripcion && !sinDesc ? `<span class="desc">${esc(p.descripcion)}</span>` : ''}</span>${foto}</button>`;
}

function espiarTabs() {
  const links = [...document.querySelectorAll('.tabs a')];
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id));
    const a = links.find(a => a.classList.contains('on'));
    if (a) a.parentNode.scrollTo({ left: a.offsetLeft - 16, behavior: 'smooth' });
  }), { rootMargin: '-60px 0px -70% 0px' });
  document.querySelectorAll('section.cat').forEach(s => io.observe(s));
}

function abrirAlergenos() {
  const el = $('alerg');
  const con = PRODS.filter(p => (p.alergenos || []).length);
  el.innerHTML = `<div class="inner">

function sugerirBebida(p) {
  const cat = CATS.find(c => c.id === p.categoria_id);

function aviso(txt) {

const precioLinea = l => (Number(PRODS.find(p => p.id === l.pid).precio) + (l.ops || []).reduce((a, o) => a + Number(o.extra || 0), 0)) * l.qty;

const DIAS = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
const aMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
function estadoPedidos() {
  if (N.pedidos_pausados) return { abierto: false, pausa: true, cuando: '' };
  const dias = N.horario?.dias; if (!dias) return { abierto: true };
  const corte = Number(N.horario.cierre_pedidos_min || 0);
  const ahora = new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/Madrid' }));
  const min = ahora.getHours() * 60 + ahora.getMinutes(), d = ahora.getDay();
  const franjas = dia => (dias[DIAS[dia]] || []).map(([a, b]) => [aMin(a), aMin(b) - corte]);
  for (const [a, b] of franjas(d)) if (min >= a && min < b) return { abierto: true };
  for (let k = 0; k < 7; k++) {
    const dia = (d + k) % 7;
    const sig = franjas(dia).find(([a]) => k > 0 || a > min);
    if (sig) {
      const h = (dias[DIAS[dia]].find(([a]) => aMin(a) === sig[0]) || [])[0];
      return { abierto: false, cuando: k === 0 ? `hoy a las ${h}` : k === 1 ? `mañana a las ${h}` : `el ${DIAS[dia].replace('miercoles', 'miércoles').replace('sabado', 'sábado')} a las ${h}` };
    }
  }
  return { abierto: false, cuando: '' };
}

const difPrecio = v => { v = Number(v || 0); return v > 0 ? ' (+' + eur(v) + ')' : v < 0 ? ' (−' + eur(-v) + ')' : ''; };

async function enviarPedido(nombre, tel, obs) {
  const b = $('pay'), e = $('perr'); b.disabled = true; b.textContent = 'Enviando…';
  const lineas = cart.map(l => ({ pid: l.pid, qty: l.qty, ops: (l.ops || []).map(o => ({ grupo: o.grupo, nombre: o.nombre })), nota: l.nota || '' }));
  const { data, error } = await sb.rpc('crear_pedido', { p_slug: slug, p_origen: ORIGEN, p_lineas: lineas, p_nombre: nombre, p_telefono: tel, p_notas: obs || null });
  if (error || !data || !data[0]) {
    b.disabled = false; b.textContent = 'Pagar ' + eur(total());
    const m = error?.message || '';
    e.style.color = '';
    e.textContent = /pausad/i.test(m) ? 'El local ha pausado los pedidos online. Inténtalo en un rato.' : /no disponible/i.test(m) ? 'Algún producto de tu pedido ya no está disponible. Revísalo.' : /Demasiados|muchos pedidos/i.test(m) ? m : 'No se pudo enviar el pedido. Inténtalo de nuevo.';
    return;
  }
  const ped = data[0];
  const resumen = cart.map(l => l.qty + '× ' + (PRODS.find(p => p.id === l.pid) || {}).nombre).join(', ');
  const info = { id: ped.id, codigo: ped.codigo, fecha: hoyMadrid(), origen: ORIGEN, resumen, total: Number(ped.total), tel };
  try { localStorage.setItem('ultimo-pedido-' + slug, JSON.stringify(info)); } catch (x) {}
  cart = []; save(); bar();
  verPedidoEnviado(info);
}

  const terminado = r.estado === 'entregado' || r.estado === 'cancelado';
  if (q) return verPedidoEnviado(info, r.estado);
  if (terminado || (info.fecha && info.fecha !== hoyMadrid())) { try { localStorage.removeItem('ultimo-pedido-' + slug); } catch (x) {} return; }
  $('mipedido')?.remove();
  const b = document.createElement('button');
  b.id = 'mipedido'; b.className = 'mipedido';
  const pintar = est => { b.innerHTML = `<span>Tu pedido <strong>${esc(r.codigo)}</strong> · ${esc(ESTADOS_CORTO[est] || est)}</span><span style="text-decoration:underline">Ver</span>`; b.onclick = () => verPedidoEnviado(info, est); };
  pintar(r.estado);
  document.querySelector('.wrap')?.prepend(b);
  if (r.estado === 'listo') alertaListo(info);
  // Sigue mirando el estado mientras la carta esté abierta
  clearInterval(revisarPedidoGuardado.t);
  revisarPedidoGuardado.t = setInterval(async () => {
    const { data } = await sb.rpc('estado_pedido', { p_id: info.id });
    const est = data && data[0] && data[0].estado; if (!est) return;
    if (est === 'entregado' || est === 'cancelado') { clearInterval(revisarPedidoGuardado.t); b.remove(); try { localStorage.removeItem('ultimo-pedido-' + slug); } catch (x) {} return; }
    pintar(est); if (est === 'listo') alertaListo(info);
  }, 10000);
}
/* ---------- Aviso de "pedido listo": pantalla verde, sonido y vibración hasta que el cliente lo vea ---------- */
let AUDIO = null;
function desbloquearAudio() { try { AUDIO = AUDIO || new (window.AudioContext || window.webkitAudioContext)(); if (AUDIO.state === 'suspended') AUDIO.resume(); } catch (x) {} }
document.addEventListener('pointerdown', desbloquearAudio, { passive: true });
function timbre() {
  try { if (AUDIO) [0, .18, .36, .9, 1.08, 1.26].forEach(t => { const o = AUDIO.createOscillator(), g = AUDIO.createGain(); o.type = 'sine'; o.frequency.value = t < .8 ? 988 : 1319; g.gain.setValueAtTime(.35, AUDIO.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, AUDIO.currentTime + t + .16); o.connect(g); g.connect(AUDIO.destination); o.start(AUDIO.currentTime + t); o.stop(AUDIO.currentTime + t + .17); }); } catch (x) {}
  try { navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 400]); } catch (x) {}
}
function alertaListo(info) {
  const k = 'listo-visto-' + info.id;
  try { if (localStorage.getItem(k)) return; } catch (x) {}
  if ($('listoYa')) return;
  const d = document.createElement('div'); d.id = 'listoYa'; d.className = 'listoya'; d.setAttribute('role', 'alertdialog'); d.setAttribute('aria-label', 'Tu pedido está listo');
  d.innerHTML = `<div style="font-size:60px">🔔</div><p class="t">¡Tu pedido está listo!</p><p class="n">${esc(info.codigo || '')}</p><p>Pasa a recogerlo en<br><strong>${esc(N.nombre)}</strong></p><button id="listoOk">Vale, voy</button>`;
  document.body.appendChild(d);
  const titulo = document.title; let par = false;
  timbre(); const t = setInterval(() => { timbre(); par = !par; document.title = par ? '🔔 ¡Pedido listo!' : titulo; }, 3000);
  $('listoOk').onclick = () => { clearInterval(t); document.title = titulo; try { navigator.vibrate && navigator.vibrate(0); localStorage.setItem(k, '1'); } catch (x) {} d.remove(); };
}
const ESTADOS_CORTO = { nuevo: 'Recibido', preparando: 'Preparando', listo: '¡Listo para recoger!' };
const ESTADOS_CLIENTE = { nuevo: 'Recibido. En cola para preparar.', preparando: 'Preparando tu pedido…', listo: '¡Listo! Ya puedes recogerlo.', entregado: 'Entregado. ¡Que aproveche!', cancelado: 'Pedido cancelado. Contacta con el local.' };
function verPedidoEnviado(info, estadoIni) {
  const { id, codigo } = info;
  const el = $('pedido');

    <p style="margin:0 auto 24px;max-width:420px;padding:12px 14px;border-radius:12px;background:#E7F5EC;color:#0B6B37;font-size:14px;line-height:1.45">Tu número queda registrado en esta página. Si cierras y vuelves a abrir la carta en este móvil, lo verás arriba en verde.</p>

    <button class="btn" id="fin" style="max-width:420px;margin:0 auto">Volver a la carta</button>
  </div>`;
  $('fin').onclick = () => { clearInterval(el._t); el.classList.remove('open'); lock(); if (/[?&]pedido=/.test(location.search)) history.replaceState(null, '', location.pathname); render(); bar(); revisarPedidoGuardado(); };
  clearInterval(el._t);
  const mirar = async () => { const { data } = await sb.rpc('estado_pedido', { p_id: id }); const est = data && data[0] && data[0].estado; if (est && $('estadoPed')) $('estadoPed').textContent = ESTADOS_CLIENTE[est] || est; if (est === 'listo') alertaListo(info); if (!$('estadoPed') || est === 'entregado' || est === 'cancelado') clearInterval(el._t); };
  el._t = setInterval(mirar, 10000);
  el.classList.add('open'); el.scrollTop = 0; lock();
}

function abrirLegal(k) {

    </div></div>`;
  $('lb').onclick = () => { el.classList.remove('open'); lock(); };

// Ratón: la rueda desplaza en horizontal las filas que se deslizan (Destacados)
document.addEventListener('wheel', e => {
  const fila = e.target.closest && e.target.closest('.dest');
  if (!fila || Math.abs(e.deltaX) > Math.abs(e.deltaY) || fila.scrollWidth <= fila.clientWidth) return;
  const fin = fila.scrollLeft + fila.clientWidth >= fila.scrollWidth - 1;
  if ((e.deltaY > 0 && fin) || (e.deltaY < 0 && fila.scrollLeft <= 0)) return;
  e.preventDefault(); fila.scrollLeft += e.deltaY;
}, { passive: false });
</script>

/* ---------- Acceso con código al correo (sin contraseña) ---------- */
function vistaAcceso(emailPrevio = '') {
  app.innerHTML = `<div class="acceso">
    <div><h1>Panel del negocio</h1><p class="sub">Escribe tu correo y te enviaremos un código para entrar. No necesitas contraseña.</p></div>
    <form id="f" style="display:flex;flex-direction:column;gap:14px">
      <label class="campo">Correo<input type="email" id="email" autocomplete="email" inputmode="email" required value="${esc(emailPrevio)}"></label>
      <p class="error" id="err" hidden></p>
      <button class="btn" type="submit">Enviar código</button>
    </form>
    <p class="sub" style="text-align:center">Solo pueden entrar los correos dados de alta por Escalia.</p>
  </div>`;
  $('email').focus();
  $('f').onsubmit = async e => {
    e.preventDefault();
    const email = $('email').value.trim().toLowerCase();
    const b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'Enviando…';
    const err = await enviarCodigo(email);
    b.disabled = false; b.textContent = 'Enviar código';
    if (err) { $('err').textContent = err; $('err').hidden = false; return; }
    vistaCodigo(email);
  };
}
async function enviarCodigo(email) {
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: 'https://pide.escaliadigital.com/panel' } });
  if (!error) return null;
  if (/rate|limit|seconds|security purposes/i.test(error.message)) return 'Has pedido varios códigos seguidos. Espera un minuto y vuelve a intentarlo.';
  if (/invalid/i.test(error.message)) return 'Ese correo no es válido. Revísalo.';
  return 'No se pudo enviar el código. Revisa tu conexión e inténtalo de nuevo.';
}
function vistaCodigo(email) {
  app.innerHTML = `<div class="acceso">
    <div><h1>Revisa tu correo</h1><p class="sub">Hemos enviado un código a <strong>${esc(email)}</strong>. Escríbelo aquí. Si no lo ves, mira en spam.</p></div>
    <form id="f" style="display:flex;flex-direction:column;gap:14px">
      <label class="campo">Código<input id="cod" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" maxlength="8" required style="font-size:26px;letter-spacing:8px;text-align:center"></label>
      <p class="error" id="err" hidden></p>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <button class="btn claro" id="reenviar" disabled>Reenviar código (60)</button>
    <button class="lnk" id="otro" style="align-self:center">Usar otro correo</button>
  </div>`;
  $('cod').focus();
  let t = 60; const r = $('reenviar');
  const reloj = setInterval(() => { t--; if (t <= 0) { clearInterval(reloj); r.disabled = false; r.textContent = 'Reenviar código'; } else r.textContent = `Reenviar código (${t})`; }, 1000);
  r.onclick = async () => { r.disabled = true; const e = await enviarCodigo(email); aviso(e || 'Código reenviado'); if (e) r.disabled = false; };
  $('otro').onclick = () => { clearInterval(reloj); vistaAcceso(email); };
  $('cod').oninput = () => { $('cod').value = $('cod').value.replace(/\D/g, ''); };
  $('f').onsubmit = async e => {
    e.preventDefault();
    const err = $('err'); err.hidden = true;
    const b = e.target.querySelector('button'); b.disabled = true;
    const { error } = await sb.auth.verifyOtp({ email, token: $('cod').value.trim(), type: 'email' });
    b.disabled = false;
    if (error) { err.textContent = /expired/i.test(error.message) ? 'El código ha caducado. Pulsa "Reenviar código".' : 'Código incorrecto. Revísalo e inténtalo de nuevo.'; err.hidden = false; return; }
    clearInterval(reloj);
  };
}

  app.innerHTML = `<div class="acceso"><h1>Cuenta sin negocio</h1><p class="sub">Esta cuenta no está vinculada a ningún negocio. Entra con el correo que diste a Escalia o avisa a James.</p><button class="btn claro" id="salir">Salir</button></div>`;

/* ---------- Datos ---------- */
async function cargar() {
  const [c, p, g, o] = await Promise.all([
    sb.from('categorias').select('id,nombre,orden,activa').eq('negocio_id', N.id).order('orden'),
    sb.from('productos').select('id,categoria_id,nombre,precio,disponible,orden,foto_url').eq('negocio_id', N.id).order('orden'),
    sb.from('grupos_opciones').select('id,producto_id,nombre,minimo,maximo,orden').order('orden').eq('negocio_id', N.id),
    sb.from('opciones').select('id,grupo_id,nombre,disponible,orden,precio_extra').eq('negocio_id', N.id).order('orden')
  ]);
  CATS = (c.data || []).filter(x => x.activa); PRODS = p.data || []; GRUPOS = g.data || []; OPCS = o.data || [];
}
const contarAgotados = () => PRODS.filter(p => !p.disponible).length + opcionesUnicas().filter(x => !x.disponible).length;
const esBebidaCat = c => /bebida/i.test(c?.nombre || '');
const grupoDe = o => GRUPOS.find(g => g.id === o.grupo_id) || {};
// Opciones agrupadas por nombre (una salsa aparece en muchos productos: se activa/agota en todos a la vez)
function opcionesUnicas() {
  const mapa = new Map();
  OPCS.forEach(o => {
    const g = grupoDe(o); if (/bebida/i.test(g.nombre || '')) return;
    const k = (g.nombre || '').replace(/ \(.*\)$/, '') + '|' + o.nombre;
    if (!mapa.has(k)) mapa.set(k, { grupo: (g.nombre || '').replace(/ \(.*\)$/, ''), nombre: o.nombre, ids: [], disponible: true });
    const e = mapa.get(k); e.ids.push(o.id); if (!o.disponible) e.disponible = false;
  });
  return [...mapa.values()];
}

function vistaPanel() { if (vista === 'mostrador') vistaMostrador(); else if (vista === 'pedidos') vistaPedidos(); else vistaCarta(); }
function cabecera() {
  const n = PEDIDOS.filter(p => p.estado === 'nuevo').length;
  return `<div class="barra"><b>${esc(N.nombre)}</b><button class="lnk" id="salir">Salir</button></div>
  <nav class="vistas" aria-label="Secciones del panel"><button data-v="pedidos" class="${vista === 'pedidos' ? 'on' : ''}">Pedidos${n ? ` <span class="globo">${n}</span>` : ''}</button><button data-v="carta" class="${vista === 'carta' ? 'on' : ''}">Carta y pausa</button></nav>`;
}
function conectarCabecera() {
  $('salir').onclick = () => sb.auth.signOut();
  app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { vista = b.dataset.v; vistaPanel(); window.scrollTo(0, 0); });
}
function vistaCarta() {
  const grupos = [...new Set(opcionesUnicas().map(x => x.grupo))];
  const nAg = contarAgotados();
  const tabs = [{ k: 'agot', t: nAg ? `Agotados (${nAg})` : 'Todo disponible ✓' }, ...CATS.filter(c => PRODS.some(p => p.categoria_id === c.id)).map(c => ({ k: 'c' + c.id, t: c.nombre })), ...grupos.map(gn => ({ k: 'g' + gn, t: gn }))];
  if (!pestana || !tabs.some(t => t.k === pestana)) pestana = nAg ? 'agot' : tabs[1]?.k;
  const agotados = PRODS.filter(p => !p.disponible).length + opcionesUnicas().filter(x => !x.disponible).length;
  app.innerHTML = `${cabecera()}
  <main>
    <section class="tarjeta" aria-labelledby="t1">
      <h2 id="t1">Pedidos online</h2>
      <p class="estado"><span class="punto" style="background:${N.pedidos_pausados ? 'var(--rojo)' : 'var(--verde)'}"></span>${N.pedidos_pausados ? 'Pausados: los clientes no pueden pedir' : 'Activos: recibiendo pedidos'}</p>
      <button class="btn ${N.pedidos_pausados ? 'verde' : 'rojo'}" id="pausa">${N.pedidos_pausados ? 'Reanudar pedidos online' : 'Pausar pedidos online'}</button>
      <p class="sub">${N.pedidos_pausados ? 'La carta se sigue viendo, pero sin poder pagar.' : 'Úsalo si hay mucho lío o te quedas sin algo importante. La carta se sigue viendo.'}</p>
    </section>
    <section class="tarjeta" aria-labelledby="t2">
      <div><h2 id="t2">Agotados</h2><p class="sub">Apaga lo que no tengas ahora. Se oculta o sale como agotado en la carta al momento.${agotados ? ` <strong style="color:var(--rojo)">${agotados} apagado${agotados > 1 ? 's' : ''}.</strong>` : ''}</p></div>
      <nav class="tabs" aria-label="Secciones">${tabs.map(t => `<button data-t="${esc(t.k)}" class="${t.k === pestana ? 'on' : ''}${t.k === 'agot' ? (nAg ? ' ag-si' : ' ag-no') : ''}">${esc(t.t)}</button>`).join('')}</nav>
      <div id="lista"></div>
    </section>
    <p style="text-align:center"><button class="lnk" id="misDocs">📄 Ver mi contrato y el anexo de datos</button></p>
  </main>`;
  conectarCabecera();
  $('pausa').onclick = cambiarPausa;
  $('misDocs').onclick = verMisDocumentos;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { pestana = b.dataset.t; vistaPanel(); });
  pintarLista();
}

function interruptor(id, on, etiqueta) {
  return `<span class="etq ${on ? 'si' : 'no'}">${on ? 'Hay' : 'Agotado'}</span><label class="sw"><input type="checkbox" data-sw="${esc(id)}" ${on ? 'checked' : ''} aria-label="${esc(etiqueta)}"><span></span></label>`;
}
function pintarLista() {
  const el = $('lista');
  if (!pestana) { el.innerHTML = '<p class="sub">Todavía no hay productos en la carta.</p>'; return; }
  if (pestana === 'agot') {
    const ps = PRODS.filter(p => !p.disponible), os = opcionesUnicas().filter(x => !x.disponible);
    if (!ps.length && !os.length) { el.innerHTML = '<p class="sub" style="color:var(--verde);font-weight:600;padding:12px 0">✓ Todo está disponible. Cuando apagues algo, aparecerá aquí para volver a activarlo rápido.</p>'; return; }
    el.innerHTML = `<p class="sub" style="padding-bottom:6px">Activa lo que ya tengas. Desaparece de esta lista al momento.</p>` +
      ps.map(p => `<div class="fila off"><span class="ph" style="${p.foto_url ? `background-image:url('${esc(p.foto_url)}')` : ''}"></span><div class="t"><div class="n">${esc(p.nombre)}</div><div class="s">${esc(CATS.find(c => c.id === p.categoria_id)?.nombre || '')}</div></div>${interruptor('p:' + p.id, false, p.nombre + ' disponible')}</div>`).join('') +
      os.map(o => `<div class="fila off"><div class="t"><div class="n">${esc(o.nombre)}</div><div class="s">${esc(o.grupo)} · en todos los productos</div></div>${interruptor('o:' + o.grupo + '|' + o.nombre, false, o.nombre + ' disponible')}</div>`).join('');
    el.querySelectorAll('[data-sw]').forEach(i => i.onchange = () => cambiar(i));
    return;
  }
  if (pestana?.startsWith('c')) {
    const ps = PRODS.filter(p => p.categoria_id === pestana.slice(1));
    el.innerHTML = ps.map(p => `<div class="fila${p.disponible ? '' : ' off'}"><span class="ph" style="${p.foto_url ? `background-image:url('${esc(p.foto_url)}')` : ''}"></span><div class="t"><div class="n">${esc(p.nombre)}</div><div class="s">${eur(p.precio)}</div></div>${interruptor('p:' + p.id, p.disponible, p.nombre + ' disponible')}</div>`).join('');
  } else {
    const gn = pestana.slice(1);
    const os = opcionesUnicas().filter(x => x.grupo === gn);
    el.innerHTML = os.map((o, i) => `<div class="fila${o.disponible ? '' : ' off'}"><div class="t"><div class="n">${esc(o.nombre)}</div><div class="s">En todos los productos</div></div>${interruptor('o:' + gn + '|' + o.nombre, o.disponible, o.nombre + ' disponible')}</div>`).join('');
  }
  el.querySelectorAll('[data-sw]').forEach(i => i.onchange = () => cambiar(i));
}

/* ---------- Pedidos en tiempo real ---------- */
const ESTADOS = { nuevo: 'Nuevo', preparando: 'Preparando', listo: 'Listo', entregado: 'Entregado', cancelado: 'Cancelado' };
const ANTERIOR = { preparando: 'nuevo', listo: 'preparando', entregado: 'listo', cancelado: 'nuevo' };
const hoyMadrid = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Madrid' });
async function cargarPedidos() {
  const { data } = await sb.from('pedidos').select('id,codigo,origen,metodo_pago,avisado_en,estado,cliente_nombre,cliente_telefono,notas,total,pagado,creado_en,lineas_pedido(nombre_producto,cantidad,opciones,observaciones,precio_unitario)')
    .eq('negocio_id', N.id).eq('fecha', hoyMadrid()).neq('estado', 'pendiente_pago').order('creado_en', { ascending: true });
  PEDIDOS = data || [];
}
function pitido() {
  if (!sonidoOk) return;
  try {
    const ctx = pitido.ctx || (pitido.ctx = new (window.AudioContext || window.webkitAudioContext)());
    [0, 0.25, 0.5].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.15); });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function escucharPedidos() {
  if (canal) sb.removeChannel(canal);
  canal = sb.channel('pedidos-' + N.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos', filter: 'negocio_id=eq.' + N.id }, async ev => {
      await cargarPedidos();
      if (ev.eventType === 'INSERT' && ev.new.origen !== 'mostrador') { pitido(); aviso('Nuevo pedido ' + (ev.new.codigo || '')); }
      if (vista === 'mostrador') return;
      if (vista === 'pedidos' || ev.eventType === 'INSERT') vistaPanel();
    }).subscribe();
  // Por si se pierde la conexión: refresco cada minuto
  clearInterval(escucharPedidos.t);
  escucharPedidos.t = setInterval(async () => { await cargarPedidos(); if (vista === 'pedidos') vistaPanel(); }, 60000);
}
function hora(iso) { return new Date(iso).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid' }); }
function hace(iso) { const m = Math.max(0, Math.floor((Date.now() - new Date(iso)) / 60000)); return m < 1 ? 'ahora' : m < 60 ? `hace ${m} min` : `hace ${Math.floor(m / 60)} h ${m % 60} min`; }
const minutos = iso => (Date.now() - new Date(iso)) / 60000;
const AVISO_MIN = 15; // a partir de aquí el tiempo se pone en rojo
let colMovil = 'nuevo', buscado = '';
let menuAbierto = null;
const telDe = p => { const t = (p.cliente_telefono || '').replace(/[^\d]/g, ''); return t.length === 9 ? '34' + t : t; };
const waDe = p => `https://wa.me/${telDe(p)}?text=${encodeURIComponent(`Hola ${p.cliente_nombre || ''} 👋 Tu pedido ${p.codigo} de ${N.nombre} está listo para recoger. ¡Te esperamos!`)}`;
function tarjetaPedido(p) {
  const tel = telDe(p);
  const lineas = (p.lineas_pedido || []).map(l => {
    const ops = (l.opciones || []).map(o => o.nombre).join(', ');
    return `<li><b>${l.cantidad}×</b> ${esc(l.nombre_producto)}${ops ? `<small>${esc(ops)}</small>` : ''}${l.observaciones ? `<em>⚠ ${esc(l.observaciones)}</em>` : ''}</li>`;
  }).join('');
  const tarde = ['nuevo', 'preparando'].includes(p.estado) && minutos(p.creado_en) >= AVISO_MIN;
  const resaltado = buscado && p.codigo.toLowerCase() === buscado;
  let boton = '';
  if (p.estado === 'nuevo') boton = `<button class="btn tk-go nuevo" data-est="${p.id}|preparando">Empezar</button>`;
  if (p.estado === 'preparando') boton = tel ? `<button class="btn tk-go preparando" data-listo="${p.id}">Listo · avisar</button>` : `<button class="btn tk-go preparando" data-est="${p.id}|listo">Listo</button>`;
  if (p.estado === 'listo') boton = `<button class="btn tk-go listo" data-est="${p.id}|entregado">Entregado</button>`;
  const avis = p.estado === 'listo' ? (tel ? (p.avisado_en ? `<p class="tk-avis">✓ Cliente avisado ${hora(p.avisado_en)}</p>` : '<p class="tk-avis" style="color:var(--rojo)">Sin avisar por WhatsApp (⋯ → Avisar)</p>') : '<p class="tk-avis">Mostrador: dile el número en voz alta</p>') : '';
  const menu = [
    ANTERIOR[p.estado] ? `<button data-est="${p.id}|${ANTERIOR[p.estado]}">↶ Deshacer</button>` : '',
    p.estado === 'listo' && tel ? `<button data-wa="${p.id}">💬 ${p.avisado_en ? 'Volver a avisar' : 'Avisar'} por WhatsApp</button>` : '',
    `<button data-imp="${p.id}">🖨 Imprimir</button>`,
    ['nuevo', 'preparando'].includes(p.estado) ? `<button class="rojo" data-est="${p.id}|cancelado">✕ Cancelar pedido</button>` : ''
  ].join('');
  return `<article class="tk ${p.estado}${resaltado ? ' buscado' : ''}" id="ped-${p.id}" aria-label="Pedido ${esc(p.codigo)}">
    <div class="tk-cab"><span class="tk-num">${esc(p.codigo)}</span>
      <span class="tk-quien"><b>${esc(p.cliente_nombre || 'Mostrador')}</b><span class="${tarde ? 'tarde' : ''}">${tarde ? '⏱ ' : ''}${hace(p.creado_en)} · ${hora(p.creado_en)}</span></span>
      <details class="mn" data-mn="${p.id}" ${menuAbierto === p.id ? 'open' : ''}><summary aria-label="Más opciones">⋯</summary><div class="menu">${menu}</div></details></div>
    <ul class="tk-lineas">${lineas}</ul>
    ${p.notas ? `<p class="tk-obs">📝 ${esc(p.notas)}</p>` : ''}
    ${avis}
    <div class="tk-pie"><span class="tk-total">${eur(p.total)} ${etiquetaPago(p)}</span>${boton}</div>
  </article>`;
}
function etiquetaPago(p) {
  if (p.origen === 'mostrador') return `<span class="etiq most">MOSTRADOR · ${p.metodo_pago === 'tarjeta_caja' ? 'TARJETA' : 'EFECTIVO'}</span>`;
  if (p.pagado) return '<span class="etiq pagado">PAGADO</span>';
  return `<span class="etiq prueba">${N.modo_prueba ? 'PRUEBA' : 'SIN PAGAR'}</span>`;
}
const COLUMNAS = [['nuevo', 'Nuevos'], ['preparando', 'Preparando'], ['listo', 'Listos']];
function vistaPedidos() {
  const por = e => PEDIDOS.filter(p => p.estado === e);
  const hechos = PEDIDOS.filter(p => ['entregado', 'cancelado'].includes(p.estado)).reverse();
  const entregados = PEDIDOS.filter(p => p.estado === 'entregado');
  app.innerHTML = `${cabecera()}
  <main class="ancho">
    ${sonidoOk ? '' : '<button class="btn claro" id="sonido">🔔 Activar sonido de pedidos nuevos</button>'}
    ${contarAgotados() ? `<button class="avisoag" id="verAg">⚠ Tienes ${contarAgotados()} agotado${contarAgotados() > 1 ? 's' : ''} — <u>Ver y activar</u></button>` : ''}
    ${N.pedidos_pausados ? '<p class="error" style="text-align:center">Los pedidos online están pausados. Puedes reanudarlos en "Carta y pausa".</p>' : ''}
    <div class="acciones"><button class="btn" id="nuevoMost">+ Pedido en mostrador</button>
    <form id="fbus" class="buscar" role="search"><input id="bus" inputmode="numeric" placeholder="Buscar nº de pedido (ej.: 5)" value="${esc(buscado.replace(/^p/, ''))}" aria-label="Buscar número de pedido"><button class="btn" style="width:auto;padding:0 18px">Buscar</button></form></div>
    <nav class="colnav" aria-label="Estados">${COLUMNAS.map(([e, t]) => `<button data-col="${e}" class="${colMovil === e ? 'on' : ''}">${t} <span>${por(e).length}</span></button>`).join('')}</nav>
    <div class="tablero">${COLUMNAS.map(([e, t]) => `<section class="columna ${e} ${colMovil === e ? 'on' : ''}" aria-label="${t}"><h2 class="colt ${e}">${t} <span>${por(e).length}</span></h2>${por(e).map(tarjetaPedido).join('') || `<p class="sub vacio">${e === 'nuevo' ? 'Sin pedidos nuevos. Aparecerán aquí al momento.' : 'Nada por ahora.'}</p>`}</section>`).join('')}</div>
    <button class="btn claro" id="hechos" style="max-width:520px;align-self:center">${verHechos ? 'Ocultar' : 'Ver'} entregados y cancelados de hoy (${hechos.length})</button>
    ${verHechos ? `<div class="hechos">${hechos.map(tarjetaPedido).join('')}</div>` : ''}
    <p class="sub" style="text-align:center">Entregado hoy: <strong>${eur(entregados.reduce((a, p) => a + Number(p.total), 0))}</strong> en ${entregados.length} pedidos</p>
  </main>`;
  conectarCabecera();
  if ($('sonido')) $('sonido').onclick = () => { sonidoOk = true; pitido(); vistaPanel(); };
  if ($('verAg')) $('verAg').onclick = () => { vista = 'carta'; pestana = 'agot'; vistaPanel(); window.scrollTo(0, 0); };
  $('hechos').onclick = () => { verHechos = !verHechos; vistaPanel(); };
  $('nuevoMost').onclick = () => { MOST = { lineas: [], nombre: '', metodo: '', cat: null, hecho: null }; vista = 'mostrador'; vistaPanel(); window.scrollTo(0, 0); };
  app.querySelectorAll('[data-imp]').forEach(b => b.onclick = () => imprimir(PEDIDOS.find(x => x.id === b.dataset.imp)));
  app.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { colMovil = b.dataset.col; vistaPanel(); });
  $('fbus').onsubmit = e => {
    e.preventDefault();
    const v = $('bus').value.trim().toLowerCase().replace(/^p/, '');
    buscado = v ? 'p' + v : '';
    const p = PEDIDOS.find(x => x.codigo.toLowerCase() === buscado);
    if (buscado && !p) { buscado = ''; return aviso('No hay ningún pedido P' + v + ' hoy'); }
    if (p && COLUMNAS.some(c => c[0] === p.estado)) colMovil = p.estado;
    if (p && !COLUMNAS.some(c => c[0] === p.estado)) verHechos = true;
    vistaPanel();
    if (p) setTimeout(() => $('ped-' + p.id)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
  };
  app.querySelectorAll('[data-mn]').forEach(d => d.ontoggle = () => { if (d.open) { menuAbierto = d.dataset.mn; app.querySelectorAll('[data-mn]').forEach(o => { if (o !== d) o.open = false; }); } else if (menuAbierto === d.dataset.mn) menuAbierto = null; });
  // "Listo · avisar": abre WhatsApp con el mensaje (en el mismo toque, para que el navegador no lo bloquee) y marca el pedido como listo
  const avisar = async (p, cambiarEstado) => {
    window.open(waDe(p), '_blank', 'noopener');
    const cambios = { avisado_en: new Date().toISOString() }; if (cambiarEstado) cambios.estado = 'listo';
    const { error } = await sb.from('pedidos').update(cambios).eq('id', p.id);
    if (error) return aviso('No se pudo guardar. Revisa la conexión.');
    Object.assign(p, cambios); menuAbierto = null; aviso(p.codigo + (cambiarEstado ? ' → Listo. Pulsa enviar en WhatsApp' : ': WhatsApp abierto')); vistaPanel();
  };
  app.querySelectorAll('[data-listo]').forEach(b => b.onclick = () => { b.disabled = true; avisar(PEDIDOS.find(x => x.id === b.dataset.listo), true); });
  app.querySelectorAll('[data-wa]').forEach(b => b.onclick = () => avisar(PEDIDOS.find(x => x.id === b.dataset.wa), false));
  let confirmar = null;
  app.querySelectorAll('[data-est]').forEach(b => b.onclick = async () => {
    const [id, est] = b.dataset.est.split('|');
    if (est === 'cancelado' && confirmar !== b) {
      confirmar = b; const txt = b.textContent; b.textContent = '¿Seguro? Toca otra vez';
      setTimeout(() => { if (confirmar === b) { confirmar = null; b.textContent = txt; } }, 4000); return;
    }
    b.disabled = true; menuAbierto = null;
    const { error } = await sb.from('pedidos').update({ estado: est }).eq('id', id);
    if (error) { b.disabled = false; return aviso('No se pudo guardar. Revisa la conexión.'); }
    const p = PEDIDOS.find(x => x.id === id); if (p) p.estado = est;
    if (p && p.codigo.toLowerCase() === buscado && !['nuevo', 'preparando', 'listo'].includes(est)) buscado = '';
    aviso((p ? p.codigo + ' → ' : '') + ESTADOS[est]); vistaPanel();
  });
}
// Actualiza los "hace X min" cada 30 s
setInterval(() => { if (N && vista === 'pedidos' && !document.querySelector('#bus:focus') && !menuAbierto) vistaPanel(); }, 30000);

/* ---------- Pedido en mostrador (clientes sin móvil, cobran en caja) ---------- */
let MOST = { lineas: [], nombre: '', metodo: '', cat: null, hecho: null };
const gruposDe = pid => GRUPOS.filter(g => g.producto_id === pid).sort((a, b) => (a.orden || 0) - (b.orden || 0));
const opcsDe = gid => OPCS.filter(o => o.grupo_id === gid).sort((a, b) => (a.orden || 0) - (b.orden || 0));
const nombreGrupo = n => (n || '').replace(/ \(.*\)$/, '');
function pista(g) {
  if (g.maximo === 1) return g.minimo >= 1 ? 'Obligatorio · elige 1' : 'Opcional · elige 1';
  return g.minimo >= 1 ? `Elige entre ${g.minimo} y ${g.maximo}` : `Opcional · hasta ${g.maximo}`;
}
const totalMost = () => MOST.lineas.reduce((a, l) => a + l.precio * l.qty, 0);
function vistaMostrador() {
  if (MOST.hecho) return vistaMostradorHecho();
  const cats = CATS.filter(c => PRODS.some(p => p.categoria_id === c.id));
  if (!MOST.cat || !cats.some(c => c.id === MOST.cat)) MOST.cat = cats[0]?.id;
  const ps = PRODS.filter(p => p.categoria_id === MOST.cat);
  const tot = totalMost();
  app.innerHTML = `<div class="barra"><button class="lnk" id="volver" style="text-decoration:none;color:#000;font-weight:600">← Volver</button><b>Pedido en mostrador</b><span style="width:60px"></span></div>
  <div class="mostr">
    <section aria-label="Carta">
      <nav class="tabs" aria-label="Secciones">${cats.map(c => `<button data-cat="${c.id}" class="${c.id === MOST.cat ? 'on' : ''}">${esc(c.nombre)}</button>`).join('')}</nav>
      <div class="prods">${ps.map(p => `<button class="prod" data-prod="${p.id}" ${p.disponible ? '' : 'disabled'}><span class="ph" style="${p.foto_url ? `background-image:url('${esc(p.foto_url)}')` : ''}"></span><span class="t"><b>${esc(p.nombre)}</b><span>${p.disponible ? eur(p.precio) : 'Agotado'}</span></span></button>`).join('')}</div>
    </section>
    <aside class="ticket" aria-label="Pedido">
      <h2>Pedido</h2>
      <div>${MOST.lineas.map((l, i) => `<div class="tl"><div class="t"><b>${esc(l.nombre)}</b>${l.ops.length ? `<small>${esc(l.ops.map(o => o.nombre).join(', '))}</small>` : ''}<small>${eur(l.precio * l.qty)}</small></div>
        <div class="cant"><button data-menos="${i}" aria-label="Quitar uno">−</button><b>${l.qty}</b><button data-mas="${i}" aria-label="Añadir uno">+</button></div></div>`).join('') || '<p class="sub">Toca los productos para añadirlos.</p>'}</div>
      <label class="campo">Nombre del cliente (opcional)<input id="mnom" maxlength="40" autocomplete="off" value="${esc(MOST.nombre)}" placeholder="Ej.: Juan"></label>
      <div class="campo">Cómo paga<div class="metodo"><button data-met="efectivo" class="${MOST.metodo === 'efectivo' ? 'on' : ''}">Efectivo</button><button data-met="tarjeta_caja" class="${MOST.metodo === 'tarjeta_caja' ? 'on' : ''}">Tarjeta</button></div></div>
      <button class="btn verde" id="crearMost" ${MOST.lineas.length ? '' : 'disabled'}>Crear pedido${tot ? ' · ' + eur(tot) : ''}</button>
      <p class="sub">Cóbralo en la caja como siempre. Aquí solo se apunta para la cola y el número.</p>
    </aside>
  </div>`;
  $('volver').onclick = () => { vista = 'pedidos'; vistaPanel(); };
  $('mnom').oninput = e => MOST.nombre = e.target.value;
  app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { MOST.cat = b.dataset.cat; vistaPanel(); });
  app.querySelectorAll('[data-prod]').forEach(b => b.onclick = () => elegirProducto(PRODS.find(p => p.id === b.dataset.prod)));
  app.querySelectorAll('[data-met]').forEach(b => b.onclick = () => { MOST.metodo = b.dataset.met; vistaPanel(); });
  app.querySelectorAll('[data-mas]').forEach(b => b.onclick = () => { MOST.lineas[+b.dataset.mas].qty++; vistaPanel(); });
  app.querySelectorAll('[data-menos]').forEach(b => b.onclick = () => { const l = MOST.lineas[+b.dataset.menos]; if (--l.qty < 1) MOST.lineas.splice(+b.dataset.menos, 1); vistaPanel(); });
  $('crearMost').onclick = crearMostrador;
}
function anadirLinea(p, ops) {
  const precio = Number(p.precio) + ops.reduce((a, o) => a + Number(o.extra || 0), 0);
  const clave = p.id + '|' + ops.map(o => o.grupo + ':' + o.nombre).join(',');
  const igual = MOST.lineas.find(l => l.clave === clave);
  if (igual) igual.qty++; else MOST.lineas.push({ clave, pid: p.id, nombre: p.nombre, precio, qty: 1, ops });
  aviso(p.nombre + ' añadido'); vistaPanel();
}
function elegirProducto(p) {
  const gs = gruposDe(p.id).filter(g => opcsDe(g.id).length);
  if (!gs.length) return anadirLinea(p, []);
  const sel = {}; gs.forEach(g => sel[g.id] = []);
  const velo = document.createElement('div'); velo.className = 'velo';
  const pintar = () => {
    const extra = gs.reduce((a, g) => a + sel[g.id].reduce((b, oid) => b + Number(OPCS.find(o => o.id === oid).precio_extra || 0), 0), 0);
    const falta = gs.find(g => sel[g.id].length < g.minimo);
    velo.innerHTML = `<div class="hoja" role="dialog" aria-modal="true" aria-label="${esc(p.nombre)}">
      <h2>${esc(p.nombre)}</h2>
      ${gs.map(g => `<div class="grp"><h3>${esc(nombreGrupo(g.nombre))} <span class="sub" style="font-weight:400">${pista(g)}</span></h3><div class="chips">${opcsDe(g.id).map(o => `<button data-g="${g.id}" data-o="${o.id}" class="${sel[g.id].includes(o.id) ? 'on' : ''}" ${o.disponible ? '' : 'disabled'}>${esc(o.nombre)}${Number(o.precio_extra) ? ` (${Number(o.precio_extra) > 0 ? '+' : ''}${eur(o.precio_extra)})` : ''}</button>`).join('')}</div></div>`).join('')}
      <button class="btn" id="hOk" ${falta ? 'disabled' : ''}>${falta ? 'Falta: ' + esc(nombreGrupo(falta.nombre)) : 'Añadir · ' + eur(Number(p.precio) + extra)}</button>
      <button class="btn claro" id="hNo">Cancelar</button></div>`;
    velo.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
      const g = gs.find(x => x.id === b.dataset.g), lst = sel[g.id], oid = b.dataset.o;
      if (lst.includes(oid)) lst.splice(lst.indexOf(oid), 1);
      else if (g.maximo === 1) sel[g.id] = [oid];
      else if (lst.length < g.maximo) lst.push(oid);
      else return aviso('Máximo ' + g.maximo);
      pintar();
    });
    velo.querySelector('#hNo').onclick = cerrar;
    velo.querySelector('#hOk').onclick = () => {
      const ops = gs.flatMap(g => sel[g.id].map(oid => { const o = OPCS.find(x => x.id === oid); return { grupo: g.nombre, nombre: o.nombre, extra: o.precio_extra }; }));
      cerrar(); anadirLinea(p, ops);
    };
  };
  const cerrar = () => { velo.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape') cerrar(); };
  velo.onclick = e => { if (e.target === velo) cerrar(); };
  document.addEventListener('keydown', esc_);
  pintar(); document.body.appendChild(velo);
}
async function crearMostrador() {
  if (!MOST.metodo) return aviso('Elige cómo paga: efectivo o tarjeta');
  const b = $('crearMost'); b.disabled = true; b.textContent = 'Creando…';
  const { data, error } = await sb.rpc('crear_pedido_mostrador', {
    p_negocio: N.id, p_nombre: MOST.nombre.trim(), p_metodo: MOST.metodo, p_notas: null,
    p_lineas: MOST.lineas.map(l => ({ pid: l.pid, qty: l.qty, ops: l.ops.map(o => ({ grupo: o.grupo, nombre: o.nombre })) }))
  });
  if (error || !data?.[0]) { b.disabled = false; b.textContent = 'Crear pedido'; return aviso(/disponible/.test(error?.message || '') ? error.message : 'No se pudo crear. Revisa la conexión.'); }
  await cargarPedidos();
  MOST.hecho = PEDIDOS.find(x => x.id === data[0].id) || { ...data[0], cliente_nombre: MOST.nombre, origen: 'mostrador', metodo_pago: MOST.metodo, creado_en: new Date().toISOString(), lineas_pedido: [] };
  vistaPanel();
}
function vistaMostradorHecho() {
  const p = MOST.hecho;
  app.innerHTML = `<div class="hecho">
    <p class="sub">Pedido creado. Dile al cliente su número:</p>
    <div class="num">${esc(p.codigo)}</div>
    <p><b>${esc(p.cliente_nombre || 'Mostrador')}</b> · ${eur(p.total)} · ${p.metodo_pago === 'tarjeta_caja' ? 'Tarjeta' : 'Efectivo'}</p>
    <button class="btn claro" id="imp">🖨 Imprimir ticket con el número</button>
    <button class="btn" id="otro">+ Otro pedido en mostrador</button>
    <button class="btn claro" id="ir">Ir a los pedidos</button>
  </div>`;
  $('imp').onclick = () => imprimir(p);
  $('otro').onclick = () => { MOST = { lineas: [], nombre: '', metodo: '', cat: MOST.cat, hecho: null }; vistaPanel(); };
  $('ir').onclick = () => { vista = 'pedidos'; vistaPanel(); window.scrollTo(0, 0); };
}
// Ticket de 80 mm con el número grande (para la bolsa o el cliente)
function imprimir(p) {
  if (!p) return;
  const lineas = (p.lineas_pedido || []).map(l => `<li><b>${l.cantidad}×</b> ${esc(l.nombre_producto)}${(l.opciones || []).length ? `<br><small>${esc(l.opciones.map(o => o.nombre).join(', '))}</small>` : ''}${l.observaciones ? `<br><small>Nota: ${esc(l.observaciones)}</small>` : ''}</li>`).join('');
  $('print').innerHTML = `<p class="c"><b>${esc(N.nombre)}</b></p><div class="pn">${esc(p.codigo)}</div>
    <p class="c">${esc(p.cliente_nombre || 'Mostrador')} · ${hora(p.creado_en)}</p><hr><ul>${lineas}</ul>
    ${p.notas ? `<p>Obs.: ${esc(p.notas)}</p>` : ''}<hr><p><b>Total ${eur(p.total)}</b> · ${p.origen === 'mostrador' ? (p.metodo_pago === 'tarjeta_caja' ? 'Tarjeta en caja' : 'Efectivo') : (p.pagado ? 'Pagado online' : 'Sin pagar')}</p>
    <p class="c" style="margin-top:6px">Este papel no es un ticket de compra</p>`;
  window.print();
}

async function cambiar(input) {
  const on = input.checked, [tipo, ref] = [input.dataset.sw.slice(0, 1), input.dataset.sw.slice(2)];
  input.disabled = true;
  let error;
  if (tipo === 'p') {
    const p = PRODS.find(x => x.id === ref);
    ({ error } = await sb.from('productos').update({ disponible: on }).eq('id', p.id));
    // Si es una bebida, también se agota/activa como bebida de los menús
    if (!error && esBebidaCat(CATS.find(c => c.id === p.categoria_id))) {
      const ids = OPCS.filter(o => o.nombre === p.nombre && /bebida/i.test(grupoDe(o).nombre || '')).map(o => o.id);
      if (ids.length) ({ error } = await sb.from('opciones').update({ disponible: on }).in('id', ids));
      if (!error) OPCS.filter(o => ids.includes(o.id)).forEach(o => o.disponible = on);
    }
    if (!error) p.disponible = on;
    if (!error) aviso(on ? p.nombre + ': disponible' : p.nombre + ': agotado');
  } else {
    const o = opcionesUnicas().find(x => x.grupo + '|' + x.nombre === ref);
    ({ error } = await sb.from('opciones').update({ disponible: on }).in('id', o.ids));
    if (!error) { OPCS.filter(x => o.ids.includes(x.id)).forEach(x => x.disponible = on); aviso(on ? o.nombre + ': disponible' : o.nombre + ': agotado'); }
  }
  if (error) { input.checked = !on; input.disabled = false; aviso('No se pudo guardar. Revisa la conexión.'); return; }
  vistaPanel();
}

async function cambiarPausa() {
  const b = $('pausa'); b.disabled = true;
  const nuevo = !N.pedidos_pausados;
  const { error } = await sb.from('negocios').update({ pedidos_pausados: nuevo }).eq('id', N.id);
  if (error) { b.disabled = false; return aviso('No se pudo guardar. Revisa la conexión.'); }
  N.pedidos_pausados = nuevo; aviso(nuevo ? 'Pedidos online pausados' : 'Pedidos online activos'); vistaPanel();
}
</script>

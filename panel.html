<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>if(/\.vercel\.app$/.test(location.hostname))location.replace('https://pide.escaliadigital.com'+location.pathname+location.search+location.hash)</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel del negocio</title>
<link href="/fonts/inter.css" rel="stylesheet">
<style>
:root{--gris:#545454;--linea:#E8E8E8;--suave:#F3F3F3;--borde:#CBCBCB;--verde:#0B7A3E;--rojo:#B42318}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;font-family:Inter,system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;font-size:16px;color:#000}
p{margin:0}
h1{margin:0;font-size:24px;font-weight:700}
h2{margin:0;font-size:18px;font-weight:700}
.sub{color:var(--gris);font-size:14px}
.barra{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--linea);position:sticky;top:0;background:#fff;z-index:5}
.barra b{font-size:17px}
.lnk{border:none;background:none;color:var(--gris);text-decoration:underline;cursor:pointer;padding:8px;font-size:14px}
main{max-width:720px;margin:0 auto;padding:18px 16px 80px;display:flex;flex-direction:column;gap:18px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:10px;border:none;background:#000;color:#fff;font-weight:600;cursor:pointer}
.btn.claro{background:var(--suave);color:#000}
.btn.rojo{background:var(--rojo)}
.btn.verde{background:var(--verde)}
.btn:disabled{opacity:.5}
.campo{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.campo input{height:50px;padding:0 14px;border-radius:10px;border:1px solid var(--borde);font-weight:400}
.error{color:var(--rojo);font-size:14px;font-weight:500}
.acceso{max-width:400px;margin:8vh auto 0;padding:0 20px;display:flex;flex-direction:column;gap:18px}
.tarjeta{border:1px solid var(--linea);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.estado{display:flex;align-items:center;gap:10px;font-weight:600}
.punto{width:12px;height:12px;border-radius:50%;flex:none}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--linea);background:#fff;cursor:pointer;font-size:14px}
.tabs button.on{background:#000;color:#fff;border-color:#000}
.fila{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linea)}
.fila:first-child{border-top:0}
.fila .ph{width:48px;height:48px;border-radius:8px;background:#EEE center/cover no-repeat;flex:none}
.fila .t{flex:1;min-width:0}
.fila .n{font-weight:500;line-height:1.3}
.fila .s{font-size:13px;color:var(--gris)}
.fila.off .n{color:var(--gris);text-decoration:line-through}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:999px;background:#C9C9C9;transition:background .15s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--verde)}
.sw input:checked+span:before{transform:translateX(22px)}
.sw input:focus-visible+span{outline:2px solid #000;outline-offset:2px}
.etq{font-size:12px;font-weight:600;width:62px;text-align:right;flex:none}
.etq.no{color:var(--rojo)}
.etq.si{color:var(--verde)}
.vistas{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--linea);position:sticky;top:57px;background:#fff;z-index:4}
.vistas button{flex:1;height:42px;border-radius:10px;border:none;background:var(--suave);font-weight:600;cursor:pointer;font-size:15px}
.vistas button.on{background:#000;color:#fff}
.globo{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--rojo);color:#fff;font-size:13px;margin-left:4px}
.etiq{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;letter-spacing:.3px;vertical-align:middle}
.etiq.prueba{background:#FFF4E0;color:#8A5300}
main.ancho{max-width:1280px}
.buscar{display:flex;gap:8px;max-width:520px;width:100%;align-self:center}
.buscar input{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--borde);font-size:16px}
.colnav{display:flex;gap:6px}
.colnav button{flex:1;height:46px;border-radius:10px;border:1px solid var(--linea);background:#fff;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap;padding:0 4px}
.colnav button span{display:inline-block;min-width:22px;padding:1px 6px;border-radius:999px;background:var(--suave);margin-left:4px}
.colnav button.on{background:#000;color:#fff;border-color:#000}
.colnav button.on span{background:#fff;color:#000}
.tablero{display:block}
.columna{display:none;flex-direction:column;gap:12px}
.columna.on{display:flex}
.colt{display:none;font-size:15px;padding:8px 12px;border-radius:10px}
.colt span{float:right}
.colt.nuevo{background:#FDECEC;color:#8E1B12}
.colt.preparando{background:#FFF4E0;color:#7A4A00}
.colt.listo{background:#E7F5EC;color:#0B6B37}
.vacio{text-align:center;padding:24px 8px}
.hechos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;opacity:.75}
@media (min-width:900px){
  .colnav{display:none}
  .tablero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
  .columna,.columna.on{display:flex}
  .colt{display:block}
}
.tk{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;border-top:6px solid #C9C9C9}
.tk.nuevo{border-top-color:var(--rojo)}
.tk.preparando{border-top-color:#E59A00}
.tk.listo{border-top-color:var(--verde)}
.tk.buscado{outline:3px solid #1A4FA0;outline-offset:2px}
.tk-cab{display:flex;align-items:center;gap:12px}
.tk-num{font-size:34px;font-weight:800;line-height:1}
.tk-quien{display:flex;flex-direction:column;font-size:13px;color:var(--gris);min-width:0}
.tk-quien b{color:#000;font-size:15px}
.tk-quien .tarde{color:var(--rojo);font-weight:700}
.tk-lineas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tk-lineas li{font-size:15px;line-height:1.35}
.tk-lineas small{display:block;color:var(--gris);font-size:13px}
.nota{color:#8A5300 !important;font-size:13px}
.tk-total{font-weight:700}
.tk-go{height:52px;font-size:17px}
.tk-go.preparando{background:var(--verde)}
.tk-go.listo{background:#000}
.tk-mas{display:flex;justify-content:space-between}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"><p class="sub" style="padding:24px">Cargando…</p></div>
<div id="toast" class="toast" role="status"></div>
<script src="/vendor/supabase.js"></script>
<script>
const sb = supabase.createClient('https://akfnzkdavpktvqugqklo.supabase.co', 'sb_publishable_ipLUEVx2Hwwf-PJR8EnL9A_X8vh9DD5', { auth: { storageKey: 'escalia-panel' } });
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => Number(n || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
let usuario = null, N = null, CATS = [], PRODS = [], GRUPOS = [], OPCS = [], pestana = null, vista = 'pedidos', PEDIDOS = [], verHechos = false, canal = null, sonidoOk = false;

function aviso(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('on'), 2200); }

async function fijarSesion(s) {
  usuario = s?.user || null;
  if (!usuario) return vistaAcceso();
  const { data: ids, error } = await sb.rpc('reclamar_invitacion');
  if (error || !ids || !ids.length) return vistaSinAcceso();
  const { data: n } = await sb.from('negocios').select('id,nombre,slug,pedidos_pausados,modo_prueba').eq('id', ids[0]).single();
  N = n;
  if (CONTRATO && !(await contratoAceptado())) return vistaContrato();
  await cargar(); await cargarPedidos(); escucharPedidos(); vistaPanel();
}

/* ---------- Aceptación del contrato (primera entrada y cada versión nueva) ---------- */
// Se activa cuando el contrato y el anexo estén cerrados: version + rutas de las páginas con el texto.
const CONTRATO = null; // ej.: { version: 'v1-2026-11', contrato: '/legal/contrato-v1.html', anexo: '/legal/anexo-v1.html' }
async function contratoAceptado() {
  const { data } = await sb.from('aceptaciones').select('documento').eq('negocio_id', N.id).eq('version', CONTRATO.version);
  const docs = new Set((data || []).map(x => x.documento));
  return docs.has('contrato_servicio') && docs.has('anexo_encargado');
}
function vistaContrato() {
  app.innerHTML = `<div class="barra"><b>${esc(N.nombre)}</b><button class="lnk" id="salir">Salir</button></div>
  <main>
    <h1>Antes de empezar</h1>
    <p class="sub">Para usar el panel tienes que leer y aceptar estos dos documentos. Se guarda la fecha y la versión que aceptas.</p>
    <a class="btn claro" href="${CONTRATO.contrato}" target="_blank" rel="noopener" style="text-decoration:none">Leer el contrato de servicio</a>
    <a class="btn claro" href="${CONTRATO.anexo}" target="_blank" rel="noopener" style="text-decoration:none">Leer el anexo de protección de datos</a>
    <label style="display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45"><input type="checkbox" id="acepto" style="width:22px;height:22px;flex:none;margin-top:1px">He leído y acepto el contrato de servicio y el anexo de encargo de tratamiento de datos (versión ${esc(CONTRATO.version)}).</label>
    <p class="error" id="err" hidden></p>
    <button class="btn" id="aceptar">Aceptar y entrar</button>
  </main>`;
  $('salir').onclick = () => sb.auth.signOut();
  $('aceptar').onclick = async () => {
    if (!$('acepto').checked) { $('err').textContent = 'Marca la casilla para continuar.'; $('err').hidden = false; return; }
    $('aceptar').disabled = true;
    const base = { negocio_id: N.id, email: usuario.email, version: CONTRATO.version, navegador: navigator.userAgent.slice(0, 300) };
    const { error } = await sb.from('aceptaciones').insert([{ ...base, documento: 'contrato_servicio' }, { ...base, documento: 'anexo_encargado' }]);
    if (error) { $('aceptar').disabled = false; $('err').textContent = 'No se pudo guardar. Revisa la conexión.'; $('err').hidden = false; return; }
    await cargar(); await cargarPedidos(); escucharPedidos(); vistaPanel();
  };
}
(async () => {
  sb.auth.onAuthStateChange((ev, s) => {
    if ((s?.user?.id || null) !== (usuario?.id || null)) fijarSesion(s);
  });
  const { data: { session } } = await sb.auth.getSession();
  await fijarSesion(session);
})();

/* ---------- Acceso ---------- */
/* ---------- Acceso con código al correo (sin contraseña) ---------- */
function vistaAcceso(emailPrevio = '') {
  app.innerHTML = `<div class="acceso">
    <div><h1>Panel del negocio</h1><p class="sub">Escribe tu correo y te enviaremos un código para entrar. No necesitas contraseña.</p></div>
    <form id="f" style="display:flex;flex-direction:column;gap:14px">
      <label class="campo">Correo<input type="email" id="email" autocomplete="email" inputmode="email" required value="${esc(emailPrevio)}"></label>
      <p class="error" id="err" hidden></p>
      <button class="btn" type="submit">Enviar código</button>
    </form>
    <p class="sub" style="text-align:center">Solo pueden entrar los correos dados de alta por Escalia.</p>
  </div>`;
  $('email').focus();
  $('f').onsubmit = async e => {
    e.preventDefault();
    const email = $('email').value.trim().toLowerCase();
    const b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'Enviando…';
    const err = await enviarCodigo(email);
    b.disabled = false; b.textContent = 'Enviar código';
    if (err) { $('err').textContent = err; $('err').hidden = false; return; }
    vistaCodigo(email);
  };
}
async function enviarCodigo(email) {
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: 'https://pide.escaliadigital.com/panel' } });
  if (!error) return null;
  if (/rate|limit|seconds|security purposes/i.test(error.message)) return 'Has pedido varios códigos seguidos. Espera un minuto y vuelve a intentarlo.';
  if (/invalid/i.test(error.message)) return 'Ese correo no es válido. Revísalo.';
  return 'No se pudo enviar el código. Revisa tu conexión e inténtalo de nuevo.';
}
function vistaCodigo(email) {
  app.innerHTML = `<div class="acceso">
    <div><h1>Revisa tu correo</h1><p class="sub">Hemos enviado un código a <strong>${esc(email)}</strong>. Escríbelo aquí. Si no lo ves, mira en spam.</p></div>
    <form id="f" style="display:flex;flex-direction:column;gap:14px">
      <label class="campo">Código<input id="cod" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" maxlength="8" required style="font-size:26px;letter-spacing:8px;text-align:center"></label>
      <p class="error" id="err" hidden></p>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <button class="btn claro" id="reenviar" disabled>Reenviar código (60)</button>
    <button class="lnk" id="otro" style="align-self:center">Usar otro correo</button>
  </div>`;
  $('cod').focus();
  let t = 60; const r = $('reenviar');
  const reloj = setInterval(() => { t--; if (t <= 0) { clearInterval(reloj); r.disabled = false; r.textContent = 'Reenviar código'; } else r.textContent = `Reenviar código (${t})`; }, 1000);
  r.onclick = async () => { r.disabled = true; const e = await enviarCodigo(email); aviso(e || 'Código reenviado'); if (e) r.disabled = false; };
  $('otro').onclick = () => { clearInterval(reloj); vistaAcceso(email); };
  $('cod').oninput = () => { $('cod').value = $('cod').value.replace(/\D/g, ''); };
  $('f').onsubmit = async e => {
    e.preventDefault();
    const err = $('err'); err.hidden = true;
    const b = e.target.querySelector('button'); b.disabled = true;
    const { error } = await sb.auth.verifyOtp({ email, token: $('cod').value.trim(), type: 'email' });
    b.disabled = false;
    if (error) { err.textContent = /expired/i.test(error.message) ? 'El código ha caducado. Pulsa "Reenviar código".' : 'Código incorrecto. Revísalo e inténtalo de nuevo.'; err.hidden = false; return; }
    clearInterval(reloj);
  };
}
function vistaSinAcceso() {
  app.innerHTML = `<div class="acceso"><h1>Cuenta sin negocio</h1><p class="sub">Esta cuenta no está vinculada a ningún negocio. Entra con el correo que diste a Escalia o avisa a James.</p><button class="btn claro" id="salir">Salir</button></div>`;
  $('salir').onclick = () => sb.auth.signOut();
}

/* ---------- Datos ---------- */
async function cargar() {
  const [c, p, g, o] = await Promise.all([
    sb.from('categorias').select('id,nombre,orden,activa').eq('negocio_id', N.id).order('orden'),
    sb.from('productos').select('id,categoria_id,nombre,precio,disponible,orden,foto_url').eq('negocio_id', N.id).order('orden'),
    sb.from('grupos_opciones').select('id,producto_id,nombre').eq('negocio_id', N.id),
    sb.from('opciones').select('id,grupo_id,nombre,disponible,orden').eq('negocio_id', N.id).order('orden')
  ]);
  CATS = (c.data || []).filter(x => x.activa); PRODS = p.data || []; GRUPOS = g.data || []; OPCS = o.data || [];
}
const esBebidaCat = c => /bebida/i.test(c?.nombre || '');
const grupoDe = o => GRUPOS.find(g => g.id === o.grupo_id) || {};
// Opciones agrupadas por nombre (una salsa aparece en muchos productos: se activa/agota en todos a la vez)
function opcionesUnicas() {
  const mapa = new Map();
  OPCS.forEach(o => {
    const g = grupoDe(o); if (/bebida/i.test(g.nombre || '')) return;
    const k = (g.nombre || '').replace(/ \(.*\)$/, '') + '|' + o.nombre;
    if (!mapa.has(k)) mapa.set(k, { grupo: (g.nombre || '').replace(/ \(.*\)$/, ''), nombre: o.nombre, ids: [], disponible: true });
    const e = mapa.get(k); e.ids.push(o.id); if (!o.disponible) e.disponible = false;
  });
  return [...mapa.values()];
}

/* ---------- Panel ---------- */
function vistaPanel() { if (vista === 'pedidos') vistaPedidos(); else vistaCarta(); }
function cabecera() {
  const n = PEDIDOS.filter(p => p.estado === 'nuevo').length;
  return `<div class="barra"><b>${esc(N.nombre)}</b><button class="lnk" id="salir">Salir</button></div>
  <nav class="vistas" aria-label="Secciones del panel"><button data-v="pedidos" class="${vista === 'pedidos' ? 'on' : ''}">Pedidos${n ? ` <span class="globo">${n}</span>` : ''}</button><button data-v="carta" class="${vista === 'carta' ? 'on' : ''}">Carta y pausa</button></nav>`;
}
function conectarCabecera() {
  $('salir').onclick = () => sb.auth.signOut();
  app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { vista = b.dataset.v; vistaPanel(); window.scrollTo(0, 0); });
}
function vistaCarta() {
  const grupos = [...new Set(opcionesUnicas().map(x => x.grupo))];
  const tabs = [...CATS.filter(c => PRODS.some(p => p.categoria_id === c.id)).map(c => ({ k: 'c' + c.id, t: c.nombre })), ...grupos.map(gn => ({ k: 'g' + gn, t: gn }))];
  if (!pestana || !tabs.some(t => t.k === pestana)) pestana = tabs[0]?.k;
  const agotados = PRODS.filter(p => !p.disponible).length + opcionesUnicas().filter(x => !x.disponible).length;
  app.innerHTML = `${cabecera()}
  <main>
    <section class="tarjeta" aria-labelledby="t1">
      <h2 id="t1">Pedidos online</h2>
      <p class="estado"><span class="punto" style="background:${N.pedidos_pausados ? 'var(--rojo)' : 'var(--verde)'}"></span>${N.pedidos_pausados ? 'Pausados: los clientes no pueden pedir' : 'Activos: recibiendo pedidos'}</p>
      <button class="btn ${N.pedidos_pausados ? 'verde' : 'rojo'}" id="pausa">${N.pedidos_pausados ? 'Reanudar pedidos online' : 'Pausar pedidos online'}</button>
      <p class="sub">${N.pedidos_pausados ? 'La carta se sigue viendo, pero sin poder pagar.' : 'Úsalo si hay mucho lío o te quedas sin algo importante. La carta se sigue viendo.'}</p>
    </section>
    <section class="tarjeta" aria-labelledby="t2">
      <div><h2 id="t2">Agotados</h2><p class="sub">Apaga lo que no tengas ahora. Se oculta o sale como agotado en la carta al momento.${agotados ? ` <strong style="color:var(--rojo)">${agotados} apagado${agotados > 1 ? 's' : ''}.</strong>` : ''}</p></div>
      <nav class="tabs" aria-label="Secciones">${tabs.map(t => `<button data-t="${esc(t.k)}" class="${t.k === pestana ? 'on' : ''}">${esc(t.t)}</button>`).join('')}</nav>
      <div id="lista"></div>
    </section>
  </main>`;
  conectarCabecera();
  $('pausa').onclick = cambiarPausa;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { pestana = b.dataset.t; vistaPanel(); });
  pintarLista();
}

function interruptor(id, on, etiqueta) {
  return `<span class="etq ${on ? 'si' : 'no'}">${on ? 'Hay' : 'Agotado'}</span><label class="sw"><input type="checkbox" data-sw="${esc(id)}" ${on ? 'checked' : ''} aria-label="${esc(etiqueta)}"><span></span></label>`;
}
function pintarLista() {
  const el = $('lista');
  if (!pestana) { el.innerHTML = '<p class="sub">Todavía no hay productos en la carta.</p>'; return; }
  if (pestana?.startsWith('c')) {
    const ps = PRODS.filter(p => p.categoria_id === pestana.slice(1));
    el.innerHTML = ps.map(p => `<div class="fila${p.disponible ? '' : ' off'}"><span class="ph" style="${p.foto_url ? `background-image:url('${esc(p.foto_url)}')` : ''}"></span><div class="t"><div class="n">${esc(p.nombre)}</div><div class="s">${eur(p.precio)}</div></div>${interruptor('p:' + p.id, p.disponible, p.nombre + ' disponible')}</div>`).join('');
  } else {
    const gn = pestana.slice(1);
    const os = opcionesUnicas().filter(x => x.grupo === gn);
    el.innerHTML = os.map((o, i) => `<div class="fila${o.disponible ? '' : ' off'}"><div class="t"><div class="n">${esc(o.nombre)}</div><div class="s">En todos los productos</div></div>${interruptor('o:' + gn + '|' + o.nombre, o.disponible, o.nombre + ' disponible')}</div>`).join('');
  }
  el.querySelectorAll('[data-sw]').forEach(i => i.onchange = () => cambiar(i));
}

/* ---------- Pedidos en tiempo real ---------- */
const ESTADOS = { nuevo: 'Nuevo', preparando: 'Preparando', listo: 'Listo', entregado: 'Entregado', cancelado: 'Cancelado' };
const ANTERIOR = { preparando: 'nuevo', listo: 'preparando', entregado: 'listo', cancelado: 'nuevo' };
const hoyMadrid = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Madrid' });
async function cargarPedidos() {
  const { data } = await sb.from('pedidos').select('id,codigo,origen,estado,cliente_nombre,cliente_telefono,notas,total,pagado,creado_en,lineas_pedido(nombre_producto,cantidad,opciones,observaciones,precio_unitario)')
    .eq('negocio_id', N.id).eq('fecha', hoyMadrid()).neq('estado', 'pendiente_pago').order('creado_en', { ascending: true });
  PEDIDOS = data || [];
}
function pitido() {
  if (!sonidoOk) return;
  try {
    const ctx = pitido.ctx || (pitido.ctx = new (window.AudioContext || window.webkitAudioContext)());
    [0, 0.25, 0.5].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.15); });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function escucharPedidos() {
  if (canal) sb.removeChannel(canal);
  canal = sb.channel('pedidos-' + N.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos', filter: 'negocio_id=eq.' + N.id }, async ev => {
      await cargarPedidos();
      if (ev.eventType === 'INSERT') { pitido(); aviso('Nuevo pedido ' + (ev.new.codigo || '')); }
      if (vista === 'pedidos' || ev.eventType === 'INSERT') vistaPanel();
    }).subscribe();
  // Por si se pierde la conexión: refresco cada minuto
  clearInterval(escucharPedidos.t);
  escucharPedidos.t = setInterval(async () => { await cargarPedidos(); if (vista === 'pedidos') vistaPanel(); }, 60000);
}
function hora(iso) { return new Date(iso).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid' }); }
function hace(iso) { const m = Math.max(0, Math.floor((Date.now() - new Date(iso)) / 60000)); return m < 1 ? 'ahora' : m < 60 ? `hace ${m} min` : `hace ${Math.floor(m / 60)} h ${m % 60} min`; }
const minutos = iso => (Date.now() - new Date(iso)) / 60000;
const AVISO_MIN = 15; // a partir de aquí el tiempo se pone en rojo
const BOTON = { nuevo: ['preparando', 'Empezar'], preparando: ['listo', 'Listo'], listo: ['entregado', 'Entregado'] };
let colMovil = 'nuevo', buscado = '';
function tarjetaPedido(p) {
  const tel = (p.cliente_telefono || '').replace(/[^\d]/g, '');
  const wa = `https://wa.me/${tel.length === 9 ? '34' + tel : tel}?text=${encodeURIComponent(`Hola ${p.cliente_nombre || ''}, tu pedido ${p.codigo} de ${N.nombre} está listo para recoger. ¡Te esperamos!`)}`;
  const lineas = (p.lineas_pedido || []).map(l => {
    const ops = (l.opciones || []).map(o => o.nombre).join(', ');
    return `<li><b>${l.cantidad}×</b> ${esc(l.nombre_producto)}${ops ? `<small>${esc(ops)}</small>` : ''}${l.observaciones ? `<small class="nota">Nota: ${esc(l.observaciones)}</small>` : ''}</li>`;
  }).join('');
  const b = BOTON[p.estado], tarde = ['nuevo', 'preparando'].includes(p.estado) && minutos(p.creado_en) >= AVISO_MIN;
  const resaltado = buscado && p.codigo.toLowerCase() === buscado;
  return `<article class="tk ${p.estado}${resaltado ? ' buscado' : ''}" id="ped-${p.id}" aria-label="Pedido ${esc(p.codigo)}">
    <div class="tk-cab"><span class="tk-num">${esc(p.codigo)}</span>
      <span class="tk-quien"><b>${esc(p.cliente_nombre || 'Mostrador')}</b><span class="${tarde ? 'tarde' : ''}">${hace(p.creado_en)} · ${hora(p.creado_en)}</span></span></div>
    <ul class="tk-lineas">${lineas}</ul>
    ${p.notas ? `<p class="nota">Observaciones: ${esc(p.notas)}</p>` : ''}
    <p class="tk-total">${eur(p.total)}${p.pagado ? '' : ` <span class="etiq prueba">${N.modo_prueba ? 'PRUEBA' : 'SIN PAGAR'}</span>`}</p>
    ${b ? `<button class="btn tk-go ${p.estado}" data-est="${p.id}|${b[0]}">${b[1]}</button>` : ''}
    ${p.estado === 'listo' && tel ? `<a class="btn claro" href="${wa}" target="_blank" rel="noopener" style="text-decoration:none;height:44px">Avisar por WhatsApp</a>` : ''}
    <div class="tk-mas">
      ${ANTERIOR[p.estado] ? `<button class="lnk" data-est="${p.id}|${ANTERIOR[p.estado]}">↶ Deshacer</button>` : ''}
      ${['nuevo', 'preparando'].includes(p.estado) ? `<button class="lnk" style="color:var(--rojo)" data-est="${p.id}|cancelado">Cancelar</button>` : ''}
    </div>
  </article>`;
}
const COLUMNAS = [['nuevo', 'Nuevos'], ['preparando', 'Preparando'], ['listo', 'Listos']];
function vistaPedidos() {
  const por = e => PEDIDOS.filter(p => p.estado === e);
  const hechos = PEDIDOS.filter(p => ['entregado', 'cancelado'].includes(p.estado)).reverse();
  const entregados = PEDIDOS.filter(p => p.estado === 'entregado');
  app.innerHTML = `${cabecera()}
  <main class="ancho">
    ${sonidoOk ? '' : '<button class="btn claro" id="sonido">🔔 Activar sonido de pedidos nuevos</button>'}
    ${N.pedidos_pausados ? '<p class="error" style="text-align:center">Los pedidos online están pausados. Puedes reanudarlos en "Carta y pausa".</p>' : ''}
    <form id="fbus" class="buscar" role="search"><input id="bus" inputmode="numeric" placeholder="Buscar nº de pedido (ej.: 5)" value="${esc(buscado.replace(/^p/, ''))}" aria-label="Buscar número de pedido"><button class="btn" style="width:auto;padding:0 18px">Buscar</button></form>
    <nav class="colnav" aria-label="Estados">${COLUMNAS.map(([e, t]) => `<button data-col="${e}" class="${colMovil === e ? 'on' : ''}">${t} <span>${por(e).length}</span></button>`).join('')}</nav>
    <div class="tablero">${COLUMNAS.map(([e, t]) => `<section class="columna ${colMovil === e ? 'on' : ''}" aria-label="${t}"><h2 class="colt ${e}">${t} <span>${por(e).length}</span></h2>${por(e).map(tarjetaPedido).join('') || `<p class="sub vacio">${e === 'nuevo' ? 'Sin pedidos nuevos. Aparecerán aquí al momento.' : 'Nada por ahora.'}</p>`}</section>`).join('')}</div>
    <button class="btn claro" id="hechos" style="max-width:520px;align-self:center">${verHechos ? 'Ocultar' : 'Ver'} entregados y cancelados de hoy (${hechos.length})</button>
    ${verHechos ? `<div class="hechos">${hechos.map(tarjetaPedido).join('')}</div>` : ''}
    <p class="sub" style="text-align:center">Entregado hoy: <strong>${eur(entregados.reduce((a, p) => a + Number(p.total), 0))}</strong> en ${entregados.length} pedidos</p>
  </main>`;
  conectarCabecera();
  if ($('sonido')) $('sonido').onclick = () => { sonidoOk = true; pitido(); vistaPanel(); };
  $('hechos').onclick = () => { verHechos = !verHechos; vistaPanel(); };
  app.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { colMovil = b.dataset.col; vistaPanel(); });
  $('fbus').onsubmit = e => {
    e.preventDefault();
    const v = $('bus').value.trim().toLowerCase().replace(/^p/, '');
    buscado = v ? 'p' + v : '';
    const p = PEDIDOS.find(x => x.codigo.toLowerCase() === buscado);
    if (buscado && !p) { buscado = ''; return aviso('No hay ningún pedido P' + v + ' hoy'); }
    if (p && COLUMNAS.some(c => c[0] === p.estado)) colMovil = p.estado;
    if (p && !COLUMNAS.some(c => c[0] === p.estado)) verHechos = true;
    vistaPanel();
    if (p) setTimeout(() => $('ped-' + p.id)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
  };
  let confirmar = null;
  app.querySelectorAll('[data-est]').forEach(b => b.onclick = async () => {
    const [id, est] = b.dataset.est.split('|');
    if (est === 'cancelado' && confirmar !== b) {
      confirmar = b; const txt = b.textContent; b.textContent = '¿Seguro? Toca otra vez';
      setTimeout(() => { if (confirmar === b) { confirmar = null; b.textContent = txt; } }, 4000); return;
    }
    b.disabled = true;
    const { error } = await sb.from('pedidos').update({ estado: est }).eq('id', id);
    if (error) { b.disabled = false; return aviso('No se pudo guardar. Revisa la conexión.'); }
    const p = PEDIDOS.find(x => x.id === id); if (p) p.estado = est;
    if (p && p.codigo.toLowerCase() === buscado && !['nuevo', 'preparando', 'listo'].includes(est)) buscado = '';
    aviso((p ? p.codigo + ' → ' : '') + ESTADOS[est]); vistaPanel();
  });
}
// Actualiza los "hace X min" cada 30 s
setInterval(() => { if (N && vista === 'pedidos' && !document.querySelector('#bus:focus')) vistaPanel(); }, 30000);

async function cambiar(input) {
  const on = input.checked, [tipo, ref] = [input.dataset.sw.slice(0, 1), input.dataset.sw.slice(2)];
  input.disabled = true;
  let error;
  if (tipo === 'p') {
    const p = PRODS.find(x => x.id === ref);
    ({ error } = await sb.from('productos').update({ disponible: on }).eq('id', p.id));
    // Si es una bebida, también se agota/activa como bebida de los menús
    if (!error && esBebidaCat(CATS.find(c => c.id === p.categoria_id))) {
      const ids = OPCS.filter(o => o.nombre === p.nombre && /bebida/i.test(grupoDe(o).nombre || '')).map(o => o.id);
      if (ids.length) ({ error } = await sb.from('opciones').update({ disponible: on }).in('id', ids));
      if (!error) OPCS.filter(o => ids.includes(o.id)).forEach(o => o.disponible = on);
    }
    if (!error) p.disponible = on;
    if (!error) aviso(on ? p.nombre + ': disponible' : p.nombre + ': agotado');
  } else {
    const o = opcionesUnicas().find(x => x.grupo + '|' + x.nombre === ref);
    ({ error } = await sb.from('opciones').update({ disponible: on }).in('id', o.ids));
    if (!error) { OPCS.filter(x => o.ids.includes(x.id)).forEach(x => x.disponible = on); aviso(on ? o.nombre + ': disponible' : o.nombre + ': agotado'); }
  }
  if (error) { input.checked = !on; input.disabled = false; aviso('No se pudo guardar. Revisa la conexión.'); return; }
  vistaPanel();
}

async function cambiarPausa() {
  const b = $('pausa'); b.disabled = true;
  const nuevo = !N.pedidos_pausados;
  const { error } = await sb.from('negocios').update({ pedidos_pausados: nuevo }).eq('id', N.id);
  if (error) { b.disabled = false; return aviso('No se pudo guardar. Revisa la conexión.'); }
  N.pedidos_pausados = nuevo; aviso(nuevo ? 'Pedidos online pausados' : 'Pedidos online activos'); vistaPanel();
}
</script>
